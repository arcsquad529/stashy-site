<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stashy - Your Visual Second Brain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justifyContent: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 600px; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #A1A1AA;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      line-height: 1.1;
    }
    p {
      font-size: 17px;
      color: #A1A1AA;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a.btn {
      display: inline-block;
      padding: 12px 24px;
      background: #FFFFFF;
      color: #000000;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.9; }
    a.btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    footer {
      margin-top: 64px;
      font-size: 13px;
      color: #71717A;
    }
    footer a { color: #A1A1AA; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Mobile App for Android & iOS</div>
    <h1>Save anything.<br>Find it instantly.</h1>
    <p>Stashy is your visual second brain for bookmarks, reels, ideas, and notes. One tap to save from any app, auto-organized into smart categories.</p>
    <!-- <div class="links">
      <a href="privacy.html" class="btn btn-secondary">Privacy Policy</a>
    </div> -->
    <footer>
      &copy; 2026 Stashy. All rights reserved. &bull; <a href="mailto:pravyomtech@gmail.com">Contact Support</a>
    </footer>
  </div>
</body>
</html>
